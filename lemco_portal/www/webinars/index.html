{% extends "templates/web.html" %}

{% block page_content %}
<link rel="stylesheet" href="/assets/lemco_portal/css/lemco_portal.css">
<script>document.body.classList.add('lp-website-body');</script>

<div class="lp-topbar">
	<div class="lp-brand"><a href="/dashboard" style="color:inherit;text-decoration:none;">LEMCO <small>PORTAL</small></a></div>
	<div class="lp-ext-links">
		<a href="/dashboard">← Back to dashboard</a>
	</div>
</div>

<div class="lp-page-wrap">
	<h1>Upcoming Webinars</h1>
	<div id="lp-webinars-full">Loading…</div>
</div>

<script>
(function () {
	function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

	function render(webinars) {
		var el = document.getElementById('lp-webinars-full');
		if (!webinars.length) {
			el.innerHTML = '<p style="color:var(--lp-muted);">No upcoming webinars right now — check back soon.</p>';
			return;
		}
		el.innerHTML = webinars.map(function (w) {
			return '<div class="lp-webinar-full">' +
				'<div class="lp-date-box"><div class="lp-mon">' + new Date(w.webinar_date).toLocaleString('en', {month:'short'}).toUpperCase() + '</div>' +
				'<div class="lp-day">' + new Date(w.webinar_date).getDate() + '</div></div>' +
				'<div class="lp-webinar-info" style="flex:1;">' +
					'<strong>' + esc(w.title) + '</strong>' +
					'<p class="lp-desc">' + esc(w.description || '') + '</p>' +
					'<div class="lp-tags">' +
						(w.language ? '<span class="lp-tag">' + esc(w.language) + '</span>' : '') +
						(w.speaker ? '<span class="lp-tag">' + esc(w.speaker) + '</span>' : '') +
						(w.duration_minutes ? '<span class="lp-tag">' + w.duration_minutes + ' min</span>' : '') +
					'</div>' +
				'</div>' +
				'<button class="lp-register-btn" data-webinar="' + esc(w.name) + '">Register</button>' +
			'</div>';
		}).join('');

		el.querySelectorAll('[data-webinar]').forEach(function (btn) {
			btn.addEventListener('click', function () {
				var name = btn.getAttribute('data-webinar');
				btn.disabled = true;
				btn.textContent = 'Registering…';
				fetch('/api/method/lemco_portal.api.register_for_webinar', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'X-Frappe-CSRF-Token': (window.frappe && frappe.csrf_token) || '',
					},
					body: JSON.stringify({ webinar: name }),
				})
					.then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.message || 'Could not register.'); return d; }); })
					.then(function () {
						btn.textContent = 'Registered ✓';
					})
					.catch(function (err) {
						btn.disabled = false;
						btn.textContent = 'Register';
						alert(err.message || 'Could not register for this webinar.');
					});
			});
		});
	}

	fetch('/api/method/lemco_portal.api.list_webinars')
		.then(function (r) { return r.json(); })
		.then(function (res) { render(res.message || []); })
		.catch(function () {
			document.getElementById('lp-webinars-full').innerHTML = '<p style="color:var(--lp-muted);">Could not load webinars.</p>';
		});
})();
</script>
{% endblock %}
