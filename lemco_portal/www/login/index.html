{% extends "templates/web.html" %}

{% block page_content %}
<link rel="stylesheet" href="/assets/lemco_portal/css/lemco_portal.css">

<div class="lp-login-screen">
	<div class="lp-login-watermark"></div>

	<div class="lp-login-card">
		<div class="lp-login-logo">LEMCO<sup>®</sup></div>

		<h1>Welcome to Lemco Portal!</h1>
		<p class="lp-login-sub" id="lp-login-msg">Please sign in to continue.</p>

		<form id="lp-login-form">
			<div class="lp-login-field">
				<input type="text" id="lp-usr" placeholder="Username" required autocomplete="username">
			</div>
			<div class="lp-login-field">
				<input type="password" id="lp-pwd" placeholder="Password" required autocomplete="current-password">
				<span class="lp-eye" id="lp-toggle-pwd">👁</span>
			</div>

			<div class="lp-login-forgot"><a href="/reset-password">Forgot password?</a></div>

			<button type="submit" class="lp-login-btn">Continue</button>
		</form>

		<div class="lp-login-create"><a href="/create-account">Create account</a></div>
	</div>
</div>

<script>
(function () {
	var msg = document.getElementById('lp-login-msg');
	var params = new URLSearchParams(window.location.search);
	if (params.get('pending') === '1') {
		msg.textContent = "Your account is registered but not yet approved. We'll email you once it's activated.";
		msg.style.color = '#E23A5B';
	}

	document.getElementById('lp-toggle-pwd').addEventListener('click', function () {
		var pwd = document.getElementById('lp-pwd');
		pwd.type = pwd.type === 'password' ? 'text' : 'password';
	});

	document.getElementById('lp-login-form').addEventListener('submit', function (e) {
		e.preventDefault();
		var usr = document.getElementById('lp-usr').value;
		var pwd = document.getElementById('lp-pwd').value;

		fetch('/api/method/login', {
			method: 'POST',
			headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
			body: 'usr=' + encodeURIComponent(usr) + '&pwd=' + encodeURIComponent(pwd),
		})
			.then(function (res) {
				if (res.ok) {
					window.location.href = '/dashboard';
				} else {
					return res.json().then(function (data) {
						throw new Error((data && data.message) || 'Login failed');
					});
				}
			})
			.catch(function (err) {
				msg.textContent = err.message || 'Incorrect username or password.';
				msg.style.color = '#E23A5B';
			});
	});
})();
</script>
{% endblock %}
