{% extends "templates/web.html" %}

{% block navbar %}{% endblock %}
{% block footer %}{% endblock %}

{% block page_content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/lemco_portal/css/lemco_portal.css?v=19">
<script>document.body.classList.add('lp-website-body', 'lp-white-bg');</script>

<div class="lp-login-screen">
	<div class="lp-login-card">
		<img class="lp-login-logo-img" src="/assets/lemco_portal/images/lemco-logo.png" alt="Lemco">

		<h1>Welcome to Lemco Portal!</h1>
		<p class="lp-login-sub" id="lp-login-msg">Please sign in to continue.</p>

		<form id="lp-login-form">
			<div class="lp-login-stack">
				<div class="lp-login-field">
					<input type="text" id="lp-usr" placeholder="Username" required autocomplete="username">
				</div>
				<div class="lp-login-field">
					<input type="password" id="lp-pwd" placeholder="Password" required autocomplete="current-password">
				</div>
			</div>

			<span class="lp-eye" id="lp-toggle-pwd">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
			</span>

			<div class="lp-login-forgot"><a href="/reset-password">Forgot password?</a></div>

			<div class="lp-login-buttons">
				<button type="submit" class="lp-login-btn" id="lp-login-submit" disabled>Continue</button>
				<a href="/create-account" class="lp-login-create">Create account</a>
			</div>

			<div class="lp-login-agree">
				<input type="checkbox" id="lp-agree-terms" required>
				<label for="lp-agree-terms">I agree to the <a href="/terms-of-service" target="_blank">Terms of Service</a> and acknowledge that I have read the <a href="/privacy-policy" target="_blank">Privacy Policy</a>.</label>
			</div>
		</form>
	</div>
</div>

<script>
(function () {
	var msg = document.getElementById('lp-login-msg');
	var params = new URLSearchParams(window.location.search);
	if (params.get('pending') === '1') {
		msg.textContent = "Your account is registered but not yet approved. We'll email you once it's activated.";
		msg.style.color = '#E23A5B';
	}

	document.getElementById('lp-toggle-pwd').addEventListener('click', function () {
		var pwd = document.getElementById('lp-pwd');
		pwd.type = pwd.type === 'password' ? 'text' : 'password';
	});

	var agreeBox = document.getElementById('lp-agree-terms');
	var submitBtn = document.getElementById('lp-login-submit');
	agreeBox.addEventListener('change', function () {
		submitBtn.disabled = !agreeBox.checked;
	});

	document.getElementById('lp-login-form').addEventListener('submit', function (e) {
		e.preventDefault();
		var usr = document.getElementById('lp-usr').value;
		var pwd = document.getElementById('lp-pwd').value;

		fetch('/api/method/login', {
			method: 'POST',
			headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
			body: 'usr=' + encodeURIComponent(usr) + '&pwd=' + encodeURIComponent(pwd),
		})
			.then(function (res) {
				if (res.ok) {
					window.location.href = '/dashboard';
				} else {
					return res.json().then(function (data) {
						throw new Error((data && data.message) || 'Login failed');
					});
				}
			})
			.catch(function (err) {
				msg.textContent = err.message || 'Incorrect username or password.';
				msg.style.color = '#E23A5B';
			});
	});
})();
</script>
{% endblock %}
